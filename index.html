<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mes recettes</title>
  <style>
    :root {
      --bg: #1b1b2f;
      --card: #252540;
      --text: #f2f2f7;
      --muted: #a9a9c4;
      --accent: #ff7a59;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
    }
    h1 { margin: 8px 0 16px; font-size: 1.8rem; }
    #recherche {
      width: 100%;
      max-width: 420px;
      padding: 10px 14px;
      border-radius: 999px;
      border: 1px solid var(--muted);
      background: var(--card);
      color: var(--text);
      font-size: 1rem;
      margin-bottom: 20px;
    }
    .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .card h2 { font-size: 1.05rem; margin: 0; }
    .card p { color: var(--muted); margin: 0; font-size: 0.95rem; white-space: pre-line; }
    .card a { color: var(--accent); text-decoration: none; font-weight: 600; margin-top: auto; }
    .empty { color: var(--muted); }
  </style>
</head>
<body>
  <h1>Mes recettes</h1>
  <input id="recherche" type="search" placeholder="Rechercher une recette...">
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden>Aucune recette pour l'instant.</p>

  <script>
    // Dépôt GitHub où le bot ajoute les recettes (dossier "recettes")
    const DEPOT = "baptiste49lebreton-afk/recettes-site";
    let recettes = [];

    function echapper(t) {
      return t.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function analyser(texte, nom) {
      const lienMatch = texte.match(/https?:\/\/\S+/);
      const lien = lienMatch ? lienMatch[0] : "";
      const sansLien = texte.replace(lien, "").trim();
      const lignes = sansLien.split("\n").map(l => l.trim()).filter(Boolean);
      const titre = lignes[0] || "Recette " + nom.replace(".txt", "");
      const description = lignes.slice(1).join("\n");
      return { id: parseInt(nom, 10), titre, description, lien };
    }

    function afficher() {
      const q = document.getElementById("recherche").value.toLowerCase();
      const grid = document.getElementById("grid");
      const empty = document.getElementById("empty");
      grid.innerHTML = "";
      const visibles = recettes.filter(r =>
        (r.titre + " " + r.description).toLowerCase().includes(q)
      );
      empty.hidden = visibles.length > 0;
      for (const r of visibles) {
        const card = document.createElement("article");
        card.className = "card";
        card.innerHTML =
          "<h2>" + echapper(r.titre) + "</h2>" +
          (r.description ? "<p>" + echapper(r.description) + "</p>" : "") +
          (r.lien ? '<a href="' + echapper(r.lien) + '" target="_blank" rel="noopener">Voir la vidéo</a>' : "");
        grid.appendChild(card);
      }
    }

    async function charger() {
      try {
        const liste = await fetch("https://api.github.com/repos/" + DEPOT + "/contents/recettes")
          .then(r => r.json());
        const fichiers = liste.filter(f => /^\d+\.txt$/.test(f.name));
        recettes = await Promise.all(fichiers.map(async f => {
          const texte = await fetch(f.download_url).then(r => r.text());
          return analyser(texte, f.name);
        }));
        recettes.sort((a, b) => b.id - a.id);
      } catch (e) {
        recettes = [];
      }
      afficher();
    }

    document.getElementById("recherche").addEventListener("input", afficher);
    charger();
  </script>
</body>
</html>
